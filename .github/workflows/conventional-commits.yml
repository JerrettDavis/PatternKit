name: Conventional Commits

on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, synchronize, reopened, ready_for_review ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and commits
        uses: actions/github-script@v9
        with:
          script: |
            const allowed = /^(build|chore|ci|deps|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?!?: .+$/;
            const allowedSpecial = /^(Merge .+|Revert ".+")$/;

            const failures = [];
            const title = context.payload.pull_request.title;

            if (!allowed.test(title) && !allowedSpecial.test(title)) {
              failures.push(`PR title: ${title}`);
            }

            // Only the PR title is validated. Linting every intermediate commit too broke
            // automated PRs whose fixup commits (e.g. from Copilot's CI-failure auto-fix)
            // aren't conventional themselves, even though the PR title is compliant.

            if (failures.length > 0) {
              core.setFailed([
                'Conventional Commit validation failed.',
                '',
                'Expected format:',
                '  type(scope): description',
                '  type: description',
                '',
                'Allowed types:',
                '  build, chore, ci, deps, docs, feat, fix, perf, refactor, revert, style, test',
                '',
                'Failures:',
                ...failures.map(f => `  - ${f}`),
              ].join('\n'));
            }
