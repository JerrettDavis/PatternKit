name: Publish docs

on:
  push:
    branches:
      - main

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Must be workflow-scoped so GitHub uses Node 24 when selecting JavaScript action runtimes.
  # This applies to all jobs in this workflow.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dotnet Setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.x

      - run: dotnet tool update -g docfx
      - name: Build DocFX source projects
        run: |
          # Keep this list in sync with docs/docfx.json metadata.src.files.
          dotnet build src/PatternKit.Core/PatternKit.Core.csproj -c Release
          dotnet build src/PatternKit.Generators.Abstractions/PatternKit.Generators.Abstractions.csproj -c Release
      - run: docfx metadata docs/docfx.json
      - run: docfx build docs/docfx.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: 'docs/_site'

      - name: Wait for artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..30}; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --paginate --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false)] | length' | awk '{sum += $1} END {print sum+0}')"
            if [ "$count" -eq 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Retry Pages deployment
        id: deployment_retry_1
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Retry Pages deployment again
        id: deployment_retry_2
        if: ${{ !cancelled() && steps.deployment_retry_1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
